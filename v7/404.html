:root {
  --blue: #4828e5;
  --signal: #3f23ca;
  --ink: #05070d;
  --ice: #e7e1ff;
  --paper: #f6f6f1;
  --white: #fff;
  --black: #05070d;
  --line-dark: rgba(5,7,13,.23);
  --line-light: rgba(255,255,255,.34);
  --gutter: clamp(17px, 2vw, 30px);
  /* Bounded section rhythm. Raw vh for internal spacing is what pushed
     sections past one viewport: a vh gap stays proportional to the viewport
     while the text it separates is sized in rem/clamp and does not shrink to
     match, so on a short viewport (1366x768 at 125% Windows scaling = 1093x614
     CSS px) the gaps kept their full share of a screen that no longer had room
     for them. clamp() lets the gaps collapse on short viewports and open up on
     tall ones, within limits, so a section can hold one screen at both ends. */
  --space-2xs: clamp(5px, 1vh, 12px);
  --space-xs: clamp(8px, 1.6vh, 18px);
  --space-s: clamp(11px, 2.4vh, 26px);
  --space-m: clamp(15px, 3.4vh, 42px);
  --space-l: clamp(21px, 5vh, 66px);
  --space-xl: clamp(28px, 7vh, 94px);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: flex; align-items: center;
  background: var(--ink); color: var(--paper);
  font-family: 'Switzer', system-ui, -apple-system, sans-serif;
  font-size: clamp(15px, 1.05vw, 17px); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.nf { width: 100%; max-width: 46rem; margin: 0 auto; padding: var(--space-xl) var(--gutter); }
.nf__eyebrow {
  margin: 0 0 var(--space-xs); color: var(--ice);
  font-size: 11px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase;
}
h1 {
  font-family: 'Zodiak', Georgia, serif; font-weight: 400;
  font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.05;
  letter-spacing: -.02em; margin: 0 0 var(--space-s);
}
p { margin: 0 0 var(--space-s); max-width: 34rem; }
.nf__links { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-m); }
.nf__links a {
  color: var(--paper); text-decoration: none;
  border: 1px solid var(--line-light); border-radius: 999px;
  padding: .5em 1.15em; font-size: .94em;
}
.nf__links a:hover { background: var(--blue); border-color: var(--blue); }
.nf__links a:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
</style>
